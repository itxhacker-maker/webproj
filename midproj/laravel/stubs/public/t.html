<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Move on Hover</title>
  <style>
    .box {
      width: 150px;
      height: 150px;
      background-color: steelblue;
      transition: transform 0.3s ease; /* Smooth movement */
    }

    .box:hover {
      transform: translate(50px, 20px); /* Moves right & down on hover */
      background-color: dodgerblue; /* Optional color change */
    }
  </style>
</head>
<body>
  <div class="box">cursor</div>
</body>
</html>
